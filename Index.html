<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f7;
      --border: rgba(0,0,0,0.08);
      --text: #1d1d1f;
      --muted: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --success: #1d8348;
      --success-bg: #f0faf4;
      --success-border: #a9dfbf;
      --error: #c0392b;
      --error-bg: #fdf2f2;
      --error-border: #f5b7b1;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: up 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── File card ── */
    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .file-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .file-icon svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Status card ── */
    .status-card {
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      gap: 13px;
      border: 1px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .status-card.idle {
      background: var(--surface);
      border-color: var(--border);
    }

    .status-card.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      animation: pop 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }

    .status-card.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      animation: pop 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }

    @keyframes pop {
      from { transform: scale(0.97); opacity: 0.6; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .status-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .status-dot.idle   { background: #e5e5ea; }
    .status-dot.success { background: var(--success); }
    .status-dot.error   { background: var(--error); }

    .status-dot svg { width: 11px; height: 11px; color: #fff; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-ring {
      width: 20px; height: 20px;
      border: 2px solid #d1d1d6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .status-body { flex: 1; }

    .status-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .status-card.success .status-title { color: var(--success); }
    .status-card.error   .status-title { color: var(--error); }

    .status-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.5;
    }

    /* ── Progress ── */
    .progress-area { display: none; flex-direction: column; gap: 8px; }
    .progress-area.visible { display: flex; }

    .progress-track {
      height: 4px;
      background: #e5e5ea;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.06s linear;
    }

    .progress-label {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    /* ── Button ── */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
      letter-spacing: -0.01em;
    }

    .btn:hover  { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); opacity: 0.9; }

    .btn svg { width: 17px; height: 17px; }

    /* ── Footer ── */
    .foot {
      text-align: center;
      font-size: 11px;
      color: #c7c7cc;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- File preview -->
  <div class="file-card">
    <div class="file-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m.75 12 3 3m0 0 3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
      </svg>
    </div>
    <div class="file-info">
      <div class="file-name">dowloadderick</div>
      <div class="file-meta">Arquivo de texto · pronto para baixar</div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-card idle" id="card">
    <div class="spin-ring" id="spinner"></div>
    <div class="status-dot success" id="dot" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <div class="status-dot error" id="dotErr" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </div>
    <div class="status-body">
      <div class="status-title" id="sTitle">Preparando seu download…</div>
      <div class="status-sub"  id="sSub"></div>

      <div class="progress-area" id="progArea">
        <div class="progress-track">
          <div class="progress-fill" id="progFill"></div>
        </div>
        <div class="progress-label" id="progLabel">0%</div>
      </div>
    </div>
  </div>

  <!-- Button -->
  <button class="btn" id="btn" onclick="triggerDownload()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
    </svg>
    Baixar novamente
  </button>

  <div class="foot">dowloadderick &nbsp;·&nbsp; seu arquivo está seguro</div>

</div>

<script>
  const card     = document.getElementById('card');
  const spinner  = document.getElementById('spinner');
  const dot      = document.getElementById('dot');
  const dotErr   = document.getElementById('dotErr');
  const sTitle   = document.getElementById('sTitle');
  const sSub     = document.getElementById('sSub');
  const progArea = document.getElementById('progArea');
  const progFill = document.getElementById('progFill');
  const progLabel= document.getElementById('progLabel');

  function resetUI() {
    card.className      = 'status-card idle';
    spinner.style.display = '';
    dot.style.display     = 'none';
    dotErr.style.display  = 'none';
    sTitle.textContent    = 'Preparando seu download…';
    sSub.textContent      = '';
    progFill.style.width  = '0%';
    progLabel.textContent = '0%';
    progArea.classList.remove('visible');
  }

  function animateProgress() {
    return new Promise(resolve => {
      progArea.classList.add('visible');
      let pct = 0;
      const iv = setInterval(() => {
        pct += Math.random() * 14 + 5;
        if (pct >= 100) {
          pct = 100;
          clearInterval(iv);
          progFill.style.width  = '100%';
          progLabel.textContent = '100%';
          setTimeout(resolve, 200);
        } else {
          progFill.style.width  = pct + '%';
          progLabel.textContent = Math.floor(pct) + '%';
          sTitle.textContent    = 'Baixando…';
        }
      }, 70);
    });
  }

  function doDownload() {
    const blob = new Blob(['Arquivo dowloadderick\nDownload realizado com sucesso!\n'], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: 'dowloadderick' });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showSuccess() {
    spinner.style.display = 'none';
    dot.style.display     = '';
    card.className        = 'status-card success';
    sTitle.textContent    = 'Seu download foi terminado com sucesso!';
    sSub.textContent      = 'O arquivo dowloadderick foi salvo no seu dispositivo.';
    progArea.classList.remove('visible');
  }

  function showError() {
    spinner.style.display  = 'none';
    dotErr.style.display   = '';
    card.className         = 'status-card error';
    sTitle.textContent     = 'Seu download não foi concluído.';
    sSub.textContent       = 'Não entendi o motivo, mas tente novamente no botão abaixo.';
    progArea.classList.remove('visible');
  }

  async function triggerDownload() {
    resetUI();
    await new Promise(r => setTimeout(r, 200));
    await animateProgress();
    try {
      doDownload();
      showSuccess();
    } catch (e) {
      showError();
    }
  }

  window.addEventListener('load', () => setTimeout(triggerDownload, 500));
</script>
</body>
</html>
